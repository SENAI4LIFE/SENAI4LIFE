<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="290" viewBox="0 0 440 290" role="img" aria-labelledby="title"><title id="title">Public project totals and contribution streaks over the displayed year</title><style>text{font-family:Arial,Helvetica,sans-serif}.bg{fill:#fff7eb}.panel{fill:#f5eadc}.line{fill:#cfb9c8}.text{fill:#38263f}.muted{fill:#6e506b}.accent{fill:#a4420b}.empty{fill:#eadce7}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes fill{from{transform:scaleX(.02)}to{transform:scaleX(1)}}@keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.value,.enter{animation:appear .8s ease-out both}.language{transform-box:fill-box;transform-origin:left center;animation:fill 1s ease-out both}.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .6s ease-out both}@media(prefers-reduced-motion:reduce){.motion{animation:none!important}.reveal{clip-path:none!important}}</style><rect x="0.5" y="0.5" width="439" height="281" rx="18" class="bg" stroke="#cfb9c8"/><text x="24" y="34" font-size="13" font-weight="700" class="accent" letter-spacing="2">OVERVIEW</text><text x="24" y="83" font-size="33" font-weight="700" class="text value motion" >10</text><text x="24" y="107" font-size="14" font-weight="400" class="muted" >public projects</text><text x="224" y="83" font-size="33" font-weight="700" class="text value motion" >1,719</text><text x="224" y="107" font-size="14" font-weight="400" class="muted" >contributions / year</text><text x="24" y="163" font-size="33" font-weight="700" class="text value motion" >110</text><text x="24" y="187" font-size="14" font-weight="400" class="muted" >active days / year</text><text x="224" y="163" font-size="33" font-weight="700" class="text value motion" >2</text><text x="224" y="187" font-size="14" font-weight="400" class="muted" >current streak / days</text><path d="M24 202h392" stroke="#cfb9c8"/><text x="24" y="229" font-size="15" font-weight="400" class="muted" >Best streak: 16 days</text></svg>
